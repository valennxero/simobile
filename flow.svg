<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-label="Alur transaksi SIMOBILE: Produk, Keranjang, Konfirmasi, Riwayat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    .dash  { animation: flow 1.2s linear infinite; }
    .dot   { animation: travel 8s ease-in-out infinite both; }
    .node  { transform-box: fill-box; transform-origin: center; animation: pulse 8s ease-in-out infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ring 8s ease-out infinite; }
    .n1 { animation-delay: 0s; }    .n2 { animation-delay: 2.24s; }
    .n3 { animation-delay: 4.48s; } .n4 { animation-delay: 6.72s; }

    @keyframes flow   { to { stroke-dashoffset: -18; } }
    @keyframes travel {
      0%       { transform: translateX(0);     opacity: 0; }
      3%, 8%   { transform: translateX(0);     opacity: 1; }
      28%, 36% { transform: translateX(220px); opacity: 1; }
      56%, 64% { transform: translateX(440px); opacity: 1; }
      84%, 96% { transform: translateX(660px); opacity: 1; }
      100%     { transform: translateX(660px); opacity: 0; }
    }
    @keyframes pulse  { 0%, 14%, 100% { transform: scale(1); } 6% { transform: scale(1.18); } }
    @keyframes ring   {
      0%   { transform: scale(1);   opacity: 0.9; }
      12%  { transform: scale(1.7); opacity: 0; }
      100% { transform: scale(1.7); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .dot { opacity: 0; }
    }
  </style>

  <rect x="1" y="1" width="898" height="208" rx="16" fill="#f1f8e9" stroke="#c5e1a5" stroke-width="2"/>
  <text x="450" y="38" font-size="17" font-weight="700" text-anchor="middle" fill="#1b5e20" letter-spacing="1">ALUR TRANSAKSI SIMOBILE</text>

  <!-- garis penghubung -->
  <line x1="120" y1="95" x2="780" y2="95" stroke="#c8e6c9" stroke-width="8" stroke-linecap="round"/>
  <line class="dash" x1="120" y1="95" x2="780" y2="95" stroke="#43a047" stroke-width="3" stroke-dasharray="8 10" stroke-linecap="round"/>

  <!-- titik emas berjalan di belakang simpul -->
  <circle class="dot" cx="120" cy="95" r="9" fill="#ffca28" stroke="#ffffff" stroke-width="3"/>

  <!-- simpul -->
  <circle class="ring n1" cx="120" cy="95" r="32" fill="none" stroke="#f9a825" stroke-width="4"/>
  <circle class="ring n2" cx="340" cy="95" r="32" fill="none" stroke="#f9a825" stroke-width="4"/>
  <circle class="ring n3" cx="560" cy="95" r="32" fill="none" stroke="#f9a825" stroke-width="4"/>
  <circle class="ring n4" cx="780" cy="95" r="32" fill="none" stroke="#f9a825" stroke-width="4"/>

  <circle class="node n1" cx="120" cy="95" r="32" fill="#2e7d32"/>
  <circle class="node n2" cx="340" cy="95" r="32" fill="#2e7d32"/>
  <circle class="node n3" cx="560" cy="95" r="32" fill="#2e7d32"/>
  <circle class="node n4" cx="780" cy="95" r="32" fill="#2e7d32"/>

  <text x="120" y="105" font-size="28" font-weight="800" text-anchor="middle" fill="#ffffff">1</text>
  <text x="340" y="105" font-size="28" font-weight="800" text-anchor="middle" fill="#ffffff">2</text>
  <text x="560" y="105" font-size="28" font-weight="800" text-anchor="middle" fill="#ffffff">3</text>
  <text x="780" y="105" font-size="28" font-weight="800" text-anchor="middle" fill="#ffffff">4</text>

  <!-- label -->
  <text x="120" y="154" font-size="18" font-weight="700" text-anchor="middle" fill="#1b5e20">Produk</text>
  <text x="120" y="176" font-size="13" text-anchor="middle" fill="#558b2f">cari dan tambah</text>

  <text x="340" y="154" font-size="18" font-weight="700" text-anchor="middle" fill="#1b5e20">Keranjang</text>
  <text x="340" y="176" font-size="13" text-anchor="middle" fill="#558b2f">atur jumlah, geser hapus</text>

  <text x="560" y="154" font-size="18" font-weight="700" text-anchor="middle" fill="#1b5e20">Konfirmasi</text>
  <text x="560" y="176" font-size="13" text-anchor="middle" fill="#558b2f">simpan transaksi</text>

  <text x="780" y="154" font-size="18" font-weight="700" text-anchor="middle" fill="#1b5e20">Riwayat</text>
  <text x="780" y="176" font-size="13" text-anchor="middle" fill="#558b2f">lihat detail lengkap</text>

</svg>
