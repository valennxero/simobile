<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="SIMOBILE - Aplikasi Kasir Mobile Toko Makmur Jaya" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b5e20"/>
      <stop offset="0.6" stop-color="#2e7d32"/>
      <stop offset="1" stop-color="#558b2f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffca28"/>
      <stop offset="1" stop-color="#f9a825"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="260" rx="20"/></clipPath>
  </defs>

  <style>
    text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    .title   { animation: slideIn 1s ease-out both; }
    .bar     { transform-box: fill-box; transform-origin: left center; animation: grow 1.2s 0.3s ease-out both; }

    /* tagline bergantian */
    .tag     { opacity: 0; animation: cycle 9s ease-in-out infinite both; }
    .tag.t1  { opacity: 1; animation-delay: 0s; }
    .tag.t2  { animation-delay: 3s; }
    .tag.t3  { animation-delay: 6s; }

    /* koin naik */
    .coin    { opacity: 0.35; animation: rise 7s linear infinite both; }
    .c1 { animation-delay: 0s; }    .c2 { animation-delay: 1.4s; }
    .c3 { animation-delay: 2.8s; }  .c4 { animation-delay: 4.2s; }
    .c5 { animation-delay: 5.6s; }  .c6 { animation-delay: 0.7s; }

    /* keranjang */
    .float   { animation: float 3s ease-in-out infinite; }
    .wheel   { transform-box: fill-box; transform-origin: center; animation: spin 1.4s linear infinite; }
    .drop    { opacity: 0; animation: drop 3s ease-in infinite both; }
    .d2      { animation-delay: 1.5s; }

    @keyframes slideIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes grow    { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes cycle   {
      0%   { opacity: 0; transform: translateY(8px); }
      5%   { opacity: 1; transform: none; }
      28%  { opacity: 1; transform: none; }
      33%  { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }
    @keyframes rise    {
      0%   { transform: translateY(0);      opacity: 0; }
      10%  { opacity: 0.55; }
      85%  { opacity: 0.35; }
      100% { transform: translateY(-250px); opacity: 0; }
    }
    @keyframes float   { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes drop    {
      0%   { transform: translateY(-50px); opacity: 0; }
      20%  { opacity: 1; }
      70%  { transform: translateY(0); opacity: 1; }
      85%  { transform: translateY(0); opacity: 0; }
      100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#round)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <circle cx="820" cy="30"  r="120" fill="#ffffff" opacity="0.05"/>
    <circle cx="60"  cy="270" r="140" fill="#ffca28" opacity="0.07"/>

    <!-- koin naik -->
    <g transform="translate(300 0)"><g class="coin c1"><circle cx="0" cy="250" r="11" fill="url(#gold)"/><text x="0" y="254" font-size="9" font-weight="700" text-anchor="middle" fill="#1b5e20">Rp</text></g></g>
    <g transform="translate(380 0)"><g class="coin c2"><circle cx="0" cy="250" r="9"  fill="url(#gold)"/><text x="0" y="253" font-size="8" font-weight="700" text-anchor="middle" fill="#1b5e20">Rp</text></g></g>
    <g transform="translate(470 0)"><g class="coin c3"><circle cx="0" cy="250" r="12" fill="url(#gold)"/><text x="0" y="254" font-size="10" font-weight="700" text-anchor="middle" fill="#1b5e20">Rp</text></g></g>
    <g transform="translate(560 0)"><g class="coin c4"><circle cx="0" cy="250" r="9"  fill="url(#gold)"/><text x="0" y="253" font-size="8" font-weight="700" text-anchor="middle" fill="#1b5e20">Rp</text></g></g>
    <g transform="translate(640 0)"><g class="coin c5"><circle cx="0" cy="250" r="11" fill="url(#gold)"/><text x="0" y="254" font-size="9" font-weight="700" text-anchor="middle" fill="#1b5e20">Rp</text></g></g>
    <g transform="translate(240 0)"><g class="coin c6"><circle cx="0" cy="250" r="8"  fill="url(#gold)"/><text x="0" y="253" font-size="7" font-weight="700" text-anchor="middle" fill="#1b5e20">Rp</text></g></g>

    <!-- judul -->
    <text class="title" x="60" y="118" font-size="68" font-weight="800" letter-spacing="5" fill="#ffffff">SIMOBILE</text>
    <rect class="bar" x="62" y="134" width="230" height="7" rx="3.5" fill="url(#gold)"/>

    <!-- tagline bergantian -->
    <text class="tag t1" x="62" y="182" font-size="22" fill="#fff8e1">Kasir mobile untuk Toko Makmur Jaya</text>
    <text class="tag t2" x="62" y="182" font-size="22" fill="#fff8e1">Catat transaksi langsung dari HP</text>
    <text class="tag t3" x="62" y="182" font-size="22" fill="#fff8e1">Stok, keranjang, riwayat dalam satu genggaman</text>

    <text x="62" y="222" font-size="14" fill="#c8e6c9" letter-spacing="1">UTS Hybrid Mobile Programming  |  Ionic Angular</text>

    <!-- keranjang belanja -->
    <g transform="translate(690 78)">
      <g class="float">
        <g transform="translate(0 0)">
          <rect class="drop d1" x="44" y="-6" width="20" height="22" rx="4" fill="#ffca28"/>
          <rect class="drop d2" x="72" y="-12" width="18" height="28" rx="4" fill="#ffffff"/>
        </g>
        <rect x="42" y="38" width="20" height="24" rx="4" fill="#ffca28"/>
        <rect x="68" y="32" width="18" height="30" rx="4" fill="#f9a825"/>
        <path d="M0 10 H18 L34 70 H100 L116 28 H26" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <g class="wheel"><circle cx="46" cy="92" r="10" fill="#ffca28"/><line x1="46" y1="82" x2="46" y2="102" stroke="#1b5e20" stroke-width="3"/></g>
        <g class="wheel"><circle cx="92" cy="92" r="10" fill="#ffca28"/><line x1="92" y1="82" x2="92" y2="102" stroke="#1b5e20" stroke-width="3"/></g>
      </g>
    </g>
  </g>
</svg>
