<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="profil-header">
    <ion-avatar>
      <ion-img src="https://avatars.githubusercontent.com/u/187404072?s=400&u=5c44f76d8ac9e09518cda3a30285b014f4ad52b4&v=4"></ion-img>
    </ion-avatar>
    <h1>{{ pemilik }}</h1>
    <p>{{ namaToko }}</p>
  </div>

  <ion-list lines="full" inset="true">
    <ion-item routerLink="/pengaturan" button detail="true">
      <ion-icon name="settings-outline" slot="start"></ion-icon>
      <ion-label>Pengaturan</ion-label>
    </ion-item>
    <ion-item routerLink="/tentang" button detail="true">
      <ion-icon name="information-circle-outline" slot="start"></ion-icon>
      <ion-label>Tentang Aplikasi</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
